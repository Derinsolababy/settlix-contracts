[workspace]
resolver = "2"
members = [
    "contracts/shared",
    "contracts/merchant_registry",
    "contracts/payment",
    "contracts/settlement",
]

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/SETTLIX/settlix-contracts"
rust-version = "1.84"

[workspace.dependencies]
soroban-sdk = "29.0.1"
shared = { path = "contracts/shared" }
merchant-registry-contract = { path = "contracts/merchant_registry" }
settlement-contract = { path = "contracts/settlement" }

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true

[profile.release-with-logs]
inherits = "release"
debug-assertions = true
